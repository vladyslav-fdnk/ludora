[project]
name = "backend"
version = "0.1.0"
description = "Ludora digital-product marketplace — Django backend"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "django-filter",
    "psycopg[binary]>=3.2",
    "pillow>=11.0",
    "drf-spectacular>=0.30.0",
    "djangorestframework-simplejwt>=5.5.1",
    "celery[redis]>=5.5,<6.0",
    "stripe>=11.0",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "mypy>=1.15",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.8",
    "ruff>=0.15.22",
]

# This is an application, not a distributable library, so it should not be
# built/packaged by uv — it only needs a synced virtual environment.
[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["migrations/", "/tests/", "conftest\\.py$", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["stripe.*", "django_filters.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.test_settings"

[tool.coverage.run]
branch = true
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
