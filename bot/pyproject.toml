[project]
name = "bot"
version = "0.1.0"
description = "Telegram Game Key Store — Aiogram bot"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.13",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
]

# This is an application, not a distributable library, so it should not be
# built/packaged by uv — it only needs a synced virtual environment.
[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["\\.venv/"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
