# Resolve the backend through Docker's DNS on each request so recreating the
# backend container does not leave nginx pointing at a stale IP address.
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep the original scheme when TLS is terminated by a proxy in front of nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/media/;
    }

    location / {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }
}
